name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          if [ -f "settings.gradle" ]; then
            echo "Android project found"
          else
            echo "Looking for ZIP project..."

            ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: No Android project or ZIP found"
              exit 1
            fi

            mkdir -p project
            unzip -q "$ZIP" -d project

            SETTINGS=$(find project -name "settings.gradle" | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle not found"
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")

            cp -r "$ROOT"/. .
          fi

      - name: Check project
        run: |
          echo "Checking project..."

          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f settings.gradle || test -f settings.gradle.kts

          echo "Project OK"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
