name: Build HeadLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort | head -300

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Khong tim thay Android project hoac ZIP"
              exit 1
            fi

            rm -rf extracted
            mkdir extracted

            unzip -q "$ZIP" -d extracted

            PROJECT_DIR=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: ZIP khong chua Android project"
              exit 1
            fi

            cp -R "$PROJECT_DIR"/. .
          fi

          echo "===== PROJECT ====="
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: Khong co thu muc app"
            exit 1
          fi

      - name: Configure repositories
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HeadLock-V2-Premium"
          include(":app")
          EOF

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Configure Android app
        shell: bash
        run: |
          set -e

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.headlock.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.headlock.v2'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.2'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Fix AppCompat theme
        shell: bash
        run: |
          set -e

          find app/src/main/res -type f \
            \( -name "*.xml" \) \
            -print0 2>/dev/null | \
          xargs -0 -r sed -i \
            's/Theme\.AppCompat\.NoActionBar/Theme.Material3.DayNight.NoActionBar/g'

          echo "===== THEME CHECK ====="
          grep -R "Theme.AppCompat" -n app/src/main || true

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -d app
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "PROJECT CHECK: OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Khong tao duoc APK"
            exit 1
          fi

          echo "APK: $APK"

          echo "===== SHA256 ====="
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
